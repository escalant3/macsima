# Generates Macsima.xcodeproj (gitignored):  xcodegen generate
# Build:  xcodebuild -project Macsima.xcodeproj -scheme Macsima -derivedDataPath .build/xcode build
name: Macsima
options:
  bundleIdPrefix: local.macsima
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Macsima:
    path: .
  # Updates (Phase 4). Linked into the app target only, so `swift test` and the
  # command-line tools never load it. MIT-licensed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Ad-hoc signing, no sandbox. scripts/make-dmg.sh signs releases with a
    # Developer ID and the hardened runtime (docs/RELEASING.md).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Bump both for every release; Sparkle compares CURRENT_PROJECT_VERSION.
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "2"
    # Sparkle's update feed and the EdDSA public key it checks updates with
    # (docs/RELEASING.md). Without a key the updater refuses to check.
    SPARKLE_FEED_URL: https://github.com/escalant3/macsima/releases/latest/download/appcast.xml
    SPARKLE_PUBLIC_KEY: TDcXNp7fxWBM9VE+5+uptdmzYrGVECPLd3XRYJeG43w=
schemes:
  Macsima:
    build:
      targets:
        Macsima: all
    test:
      targets: [MacsimaUITests]
      # The test runner is sandboxed: files the tests open are put under .build/uitests here.
      preActions:
        - name: UI test files
          settingsTarget: Macsima
          script: |
            rm -rf "$SRCROOT/.build/uitests" && mkdir -p "$SRCROOT/.build/uitests"
            cp "$SRCROOT/Tests/Fixtures/wxmx/macsima-written/01-cell-kinds.wxmx" "$SRCROOT/.build/uitests/rename.wxmx"
targets:
  Macsima:
    type: application
    platform: macOS
    sources:
      - App/Macsima
    dependencies:
      - package: Macsima
        product: MacsimaUI
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macsima.Macsima
        PRODUCT_NAME: Macsima
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Macsima/Info.plist
      properties:
        CFBundleDisplayName: Macsima
        CFBundleDevelopmentRegion: en
        # The languages the app is translated into (docs/LOCALIZATION.md). AppKit
        # localizes its own menus and panels only for the languages listed here.
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: GPL-2.0-or-later
        CFBundleDocumentTypes:
          - CFBundleTypeName: wxMaxima Worksheet
            CFBundleTypeRole: Editor
            # Alternate: never take over .wxmx from wxMaxima.
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.sf.wxmaxima.wxmx]
          - CFBundleTypeName: wxMaxima Batch Worksheet
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.sf.wxmaxima.wxm]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.sf.wxmaxima.wxmx
            UTTypeDescription: wxMaxima Worksheet
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wxmx]
          - UTTypeIdentifier: net.sf.wxmaxima.wxm
            UTTypeDescription: wxMaxima Batch Worksheet
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [wxm]
  # Real keystrokes through XCUITest (Phase 3). Needs Automation Mode; see Tests/UITests/README.md.
  MacsimaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
        excludes: ["README.md"]
    dependencies:
      - target: Macsima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macsima.MacsimaUITests
        TEST_TARGET_NAME: Macsima
        GENERATE_INFOPLIST_FILE: YES
